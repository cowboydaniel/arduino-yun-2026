name: Firmware

# Builds linino-upgrade.bin and sysupgrade.bin. Run it by hand, or push a
# tag like v2026.1 to also publish a GitHub release.
on:
  workflow_dispatch:
    inputs:
      bare:
        description: 'Plain OpenWrt on the new layout, without the Arduino packages'
        type: boolean
        default: false
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # An OpenWrt build needs about 15 GB; the runner has less free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Build
        env:
          BARE: ${{ inputs.bare && '1' || '0' }}
          BUILD_DIR: ${{ runner.temp }}/yun-build
        run: scripts/build.sh

      - name: Collect images
        run: |
          mkdir -p out
          cp "$RUNNER_TEMP"/yun-build/openwrt/bin/targets/ath79/generic/*arduino_yun-2026* out/
          # Users run this on the stock firmware to install linino-upgrade.bin.
          cp tools/yun-migrate out/
          cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS
          # The stock firmware's busybox has md5sum but no sha256sum.
          md5sum *.bin > MD5SUMS && cat MD5SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: yun-2026-firmware
          path: out/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
