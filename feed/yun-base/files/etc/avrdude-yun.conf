# The ATmega32U4 on the Arduino Yun, programmed over ISP by bit-banging the
# AR9331 GPIO lines (the same pins as the stock Linino firmware). Used as
# "avrdude -C +/etc/avrdude-yun.conf -c yun -P gpiochip0 ...".
#
# The SPI level shifter (GPIO 21, "yun:oe:spi") has to be enabled first;
# run-avrdude does that.

programmer
    id              = "yun";
    desc            = "Arduino Yun ATmega32U4 via AR9331 GPIO (libgpiod)";
    type            = "linuxgpio";
    prog_modes      = PM_ISP;
    connection_type = linuxgpio;
    reset           = ~18;
    sck             = 11;
    sdo             = 27;
    sdi             = 8;
;
