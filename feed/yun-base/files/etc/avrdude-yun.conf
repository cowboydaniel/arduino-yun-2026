# The ATmega32U4 on the Arduino Yun, programmed over ISP from the AR9331's
# GPIO lines: SCK 11, MOSI 27, MISO 8, reset 18 (inverted).
#
# The SPI level shifter (GPIO 21, "yun:oe:spi") has to be enabled first;
# run-avrdude does that.

# As the stock firmware (its "linuxspi_yun"): the kernel's bit-banged SPI bus
# 1 on those pins. Used as
#   avrdude -C +/etc/avrdude-yun.conf -c yun-spi \
#       -P /dev/spidev1.0:/dev/gpiochip0 -x disable_no_cs ...
programmer
    id              = "yun-spi";
    desc            = "Arduino Yun ATmega32U4 via /dev/spidev1.0 (as the stock firmware)";
    type            = "linuxspi";
    prog_modes      = PM_ISP;
    reset           = ~18;
;

# avrdude bit-banging the lines itself, with the SPI bus let go of them
# (run-avrdude does that with YUN_ISP=gpio). Used as
#   avrdude -C +/etc/avrdude-yun.conf -c yun -P gpiochip0 ...

programmer
    id              = "yun";
    desc            = "Arduino Yun ATmega32U4 via AR9331 GPIO (libgpiod)";
    type            = "linuxgpio";
    prog_modes      = PM_ISP;
    connection_type = linuxgpio;
    reset           = ~18;
    sck             = 11;
    sdo             = 27;
    sdi             = 8;
;
